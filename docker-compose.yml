services:
  arc-raiders-salvage:
    build:
      context: .
      dockerfile: Dockerfile
    image: fr4iser/salvagearc:latest
    container_name: arc-raiders-salvage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    dns:
      - 1.1.1.1
    ports:
      - "8080:8080"